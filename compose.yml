services:
  komari:
    image: ghcr.io/komari-monitor/komari:latest
    container_name: komari
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
    expose:
      - "25774"
    networks:
      - komari-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: komari-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${ARGO_AUTH}
    depends_on:
      - komari
    networks:
      - komari-net

networks:
  komari-net:
    driver: bridge