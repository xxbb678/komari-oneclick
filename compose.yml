services:
  komari:
    image: ghcr.io/komari-monitor/komari:latest
    container_name: komari
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 通知模板 {{time}} 用 Go 的 time.Local 渲染，未设 TZ 时容器为 UTC，
      # 通知时间会比北京时间慢 8 小时。
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
    expose:
      - "25774"
    networks:
      - komari-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: komari-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${ARGO_AUTH}
    depends_on:
      - komari
    networks:
      - komari-net

networks:
  komari-net:
    driver: bridge